<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>燃练</title>
  <style>
    :root {
      --rpx: calc(100vw / 750);
      --c-primary: #ff4a1a;
      --c-primary-2: #ff8a2a;
      --c-price: #ff6a33;
      --c-bg: #16100d;
      --c-surface: #241812;
      --c-text: #fff4ec;
      --c-text-2: #e2b89a;
      --c-text-3: #b07a5e;
      --c-line: #3d241c;
      --c-chip: #331c16;
      --c-orange-bg: #3a160e;
      --nav-h: 64px;
      --status-h: 20px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    html, body, #app {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(1100px 520px at 12% -8%, rgba(255, 72, 18, .42), transparent 58%),
        radial-gradient(900px 420px at 92% 6%, rgba(255, 140, 40, .22), transparent 55%),
        var(--c-bg);
      color: var(--c-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 15px;
    }
    #app { width: 100%; position: relative; }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; padding: 0; margin: 0; }
    img { display: block; object-fit: cover; }
    .page {
      display: none;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--nav-h);
    }
    .page.is-on { display: block; }
    .page.home-bg {
      background: radial-gradient(980px 420px at 18% -12%, rgba(255, 70, 16, .5), transparent 62%);
    }
    .tab-pad { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .cta-pad { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    .hd {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: var(--nav-h); padding-top: var(--status-h);
      background: #241812; border-bottom: 1px solid #3d241c;
    }
    .hd-inner { height: 44px; display: flex; align-items: center; }
    .hd-left, .hd-right { width: 72px; flex: none; }
    .hd-title { flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 650; line-height: 44px; color: #fff4ec; }
    .icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .ico { display: inline-block; flex: none; vertical-align: middle; }
    .tab-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      height: 56px; padding-bottom: env(safe-area-inset-bottom);
      box-sizing: content-box; background: #241812; border-top: 1px solid #3d241c;
      display: none;
    }
    .tab-bar.is-on { display: flex; }
    .tab-item { flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8a6a58; }
    .tab-item.is-on { color: #ff4a1a; font-weight: 650; }
    .tab-txt { font-size: 10px; line-height: 1.2; }
    .card { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.38); }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border-radius: 12px; font-size: 13px; font-weight: 650; }
    .btn-primary { color: #fff; background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); box-shadow: 0 3px 8px rgba(255,95,61,.35); }
    .btn-ghost { background: transparent; border: 1px solid var(--c-line); color: var(--c-text-2); }
    .btn-disabled { background: #3a241c; color: #8a5a48; pointer-events: none; box-shadow: none; }
    .btn-lg { min-height: 44px; padding: 0 22px; font-size: 15px; }
    .btn-block { width: calc(100% - 32px); margin: 0 16px; display: flex; }
    .price { color: var(--c-price); font-weight: 800; }
    .origin { color: #8a6a58; text-decoration: line-through; font-size: 12px; font-weight: 400; }
    .tag { display: inline-block; font-size: 11px; color: var(--c-text-3); background: var(--c-chip); border-radius: 6px; padding: 2px 6px; margin-right: 4px; }
    .tag-orange { color: var(--c-primary); background: var(--c-orange-bg); }
    .muted { color: var(--c-text-3); font-size: 12px; }
    .pad { padding: 12px 16px; }
    .sec-h { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 700; padding: 16px 16px 8px; }
    .sec-h .more { font-size: 13px; font-weight: 400; color: var(--c-text-3); display: inline-flex; align-items: center; gap: 2px; }
    .home-loc { display: flex; align-items: center; gap: 6px; padding: 10px 96px 0 16px; font-weight: 650; }
    .home-loc-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .store-dd { display: none; position: absolute; z-index: 50; left: 12px; right: 12px; top: 46px; background: var(--c-surface); border: 1px solid var(--c-line); border-top: 2px solid var(--c-primary); border-radius: 14px; box-shadow: 0 16px 40px rgba(255,70,16,.22); max-height: 68vh; overflow: auto; padding: 10px 0 8px; }
    .store-dd.is-on { display: block; }
    .home-loc-wrap { position: relative; z-index: 16; }
    .chip { display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: 16px; background: var(--c-chip); color: var(--c-text-2); font-size: 12px; margin-right: 8px; border: 1px solid transparent; }
    .chip.is-on { color: #fff; background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); }
    .dd-cities { display: flex; gap: 8px; padding: 4px 12px 10px; overflow-x: auto; }
    .store-dd-item { display: flex; margin: 0 12px; padding: 10px; gap: 10px; align-items: center; border-radius: 10px; min-width: 0; }
    .store-dd-item.is-on { background: var(--c-orange-bg); }
    .store-dd-item img { width: 48px; height: 48px; border-radius: 8px; flex: none; }
    .swiper { position: relative; margin: 12px 16px 0; height: 172px; border-radius: 12px; overflow: hidden; background: #2a1610; }
    .swiper-track { display: flex; height: 100%; transition: transform .35s ease; }
    .swiper-item { position: relative; min-width: 100%; height: 100%; }
    .swiper-item img { width: 100%; height: 100%; }
    .swiper-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.55)); font-weight: 700; }
    .swiper-sub { display: block; font-size: 12px; font-weight: 400; opacity: .9; margin-top: 2px; }
    .dots { display: flex; justify-content: center; gap: 4px; margin-top: 8px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #5a3228; }
    .dot.is-on { width: 14px; border-radius: 4px; background: var(--c-primary); }
    .entry-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 16px 16px 4px; }
    .entry { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .entry-ico { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .entry-label { font-size: 12px; color: var(--c-text-2); }
    .e1 { background: linear-gradient(135deg,#ff8a2a,#ff3b12); }
    .e2 { background: linear-gradient(135deg,#ff6a3d,#c41d1d); }
    .e3 { background: linear-gradient(135deg,#ffb347,#ff5a1f); }
    .e4 { background: linear-gradient(135deg,#ff7a45,#d63a12); }
    .store-card { display: flex; gap: 12px; align-items: center; margin: 0 16px; padding: 10px; min-width: 0; }
    .store-card img { width: 72px; height: 72px; border-radius: 8px; flex: none; }
    .store-card .main, .session-card .mid, .pkg-row .main, .list-row .left { flex: 1; min-width: 0; }
    .h-scroll { display: flex; overflow-x: auto; padding: 0 16px 4px; height: 176px; }
    .class-hcard { flex: none; width: 148px; margin-right: 10px; overflow: hidden; }
    .class-hcard img { width: 148px; height: 96px; }
    .class-hcard .meta { padding: 8px 10px 10px; }
    .meta-title, .mid-title { font-size: 15px; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-banner { margin: 0 16px 8px; overflow: hidden; position: relative; }
    .act-banner img { width: 100%; height: 168px; }
    .act-banner .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.78)); font-weight: 700; }
    .seg { display: flex; background: #241812; border-bottom: 1px solid #3d241c; }
    .seg-btn { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; color: #b07a5e; position: relative; }
    .seg-btn.is-on { color: #ff4a1a; font-weight: 650; }
    .seg-btn.is-on::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 0; height: 2px; background: #ff4a1a; }
    .date-strip { display: flex; overflow-x: auto; padding: 8px 12px; gap: 8px; }
    .date-chip { flex: none; width: 52px; padding: 8px 0; border-radius: 10px; text-align: center; background: var(--c-chip); color: var(--c-text-3); font-size: 11px; }
    .date-chip .d-num { display: block; font-size: 16px; font-weight: 700; color: var(--c-text); }
    .date-chip.is-on { background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); color: #fff; }
    .date-chip.is-on .d-num { color: #fff; }
    .filter-row { display: flex; overflow-x: auto; padding: 6px 16px 8px; }
    .group-h { padding: 12px 16px 4px; font-size: 13px; color: var(--c-text-3); }
    .session-card { display: flex; gap: 10px; align-items: center; margin: 8px 16px; padding: 10px; min-width: 0; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; flex: none; background: #3a241c; }
    .session-card .right { text-align: right; flex: none; }
    .cover-wrap { width: 100%; height: 211px; overflow: hidden; background: #2a1610; }
    .cover-wrap img { width: 100%; height: 100%; }
    .kv { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px; }
    .kv-cell { background: var(--c-surface); border-radius: 8px; padding: 10px 8px; text-align: center; min-width: 0; }
    .kv-b { display: block; font-size: 14px; font-weight: 700; }
    .kv-s { font-size: 11px; color: var(--c-text-3); }
    .info-card { margin: 8px 16px; padding: 12px; font-size: 13px; color: var(--c-text-2); line-height: 1.8; white-space: pre-wrap; }
    .rule-card { margin: 8px 16px; padding: 12px; font-size: 13px; color: #ffb089; background: var(--c-orange-bg); border: 1px solid #5a2418; line-height: 1.7; white-space: pre-wrap; }
    .article { padding: 8px 16px 16px; font-size: 14px; color: var(--c-text-2); line-height: 1.8; }
    .sticky-cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--c-surface); border-top: 1px solid var(--c-line); }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--c-line); font-size: 15px; min-width: 0; }
    .list-row .left { display: flex; align-items: center; gap: 10px; }
    .row-val { text-align: right; min-width: 0; }
    .detail-title { font-size: 20px; font-weight: 700; }
    .profile-hero { margin: 12px 16px 0; padding: 16px; border-radius: 12px; color: #fff; background: linear-gradient(120deg, #ff8a2a 0%, #ff3b12 70%); display: flex; align-items: center; gap: 12px; }
    .pf-ava { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,244,236,.45); }
    .pf-name { font-size: 18px; font-weight: 700; display: block; }
    .wx-login-card { margin: 12px 16px 0; padding: 28px 20px 24px; border-radius: 12px; background: #241812; border: 1px solid #3d241c; }
    .wx-login-title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .wx-login-sub { text-align: center; font-size: 13px; color: #b07a5e; margin-bottom: 20px; }
    .wx-login-btn { width: 100%; height: 44px; line-height: 44px; border-radius: 8px; background: #07c160; color: #fff; font-size: 16px; font-weight: 650; }
    .asset-bar { display: grid; grid-template-columns: 1fr 1fr; margin: 12px 16px 0; }
    .asset-btn { padding: 16px 8px; text-align: center; }
    .asset-num { display: block; font-size: 22px; color: var(--c-primary); font-weight: 700; }
    .asset-lab { font-size: 12px; color: var(--c-text-3); }
    .train-card { margin: 12px 16px 8px; padding: 12px 14px; font-size: 13px; color: var(--c-text-2); }
    .menu-card { margin: 8px 16px 24px; overflow: hidden; }
    .logout-btn { margin: 24px 16px 8px; height: 48px; border-radius: 12px; background: #241812; border: 1px solid #3d241c; display: flex; align-items: center; justify-content: center; color: #e64340; font-size: 16px; font-weight: 500; }
    .empty { text-align: center; padding: 48px 24px; color: var(--c-text-3); font-size: 14px; }
    .pkg-row { display: flex; gap: 10px; margin: 8px 16px; padding: 10px; min-width: 0; }
    .pkg-row img { width: 88px; height: 66px; border-radius: 8px; flex: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 16px; }
    .venue-card { overflow: hidden; min-width: 0; }
    .venue-card img { width: 100%; height: 110px; }
    .venue-card .meta { padding: 8px 10px 10px; }
    .camp-card { margin: 8px 16px; overflow: hidden; }
    .slot-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; padding: 12px 16px; }
    .slot { height: 40px; border-radius: 10px; background: #331c16; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .slot.is-on { background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); color: #fff; }
    .slot.is-busy { opacity: .35; pointer-events: none; }
    .gallery { display: flex; overflow-x: auto; gap: 8px; padding: 0 16px 8px; }
    .gallery img { width: 120px; height: 80px; border-radius: 8px; flex: none; }
    .field { padding: 8px 16px; }
    .field-lab { display: block; font-size: 13px; color: var(--c-text-2); margin-bottom: 6px; }
    .field-input, .field-textarea {
      width: 100%; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--c-line);
      background: #331c16; color: var(--c-text);
    }
    .field-textarea { height: 88px; padding: 10px 12px; resize: none; }
    .pay-ok, .pay-fail { width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    .pay-ok { background: #3dcc86; }
    .pay-fail { background: #e24c4c; }
    .mask { display: none; position: fixed; inset: 0; z-index: 70; background: rgba(10,6,4,.62); }
    .mask.is-on { display: block; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #241812; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom); }
    .sheet-h { text-align: center; font-weight: 700; padding: 16px 16px 12px; }
    .toast { position: fixed; left: 50%; top: 46%; transform: translate(-50%,-50%); z-index: 90; background: rgba(20,12,10,.92); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; display: none; max-width: 80%; text-align: center; }
    .loading { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; }
    .loading.is-on { display: flex; }
    .loading-box { background: rgba(20,12,10,.92); color: #fff; padding: 16px 22px; border-radius: 10px; font-size: 14px; }
    .modal { position: fixed; inset: 0; z-index: 96; background: rgba(10,6,4,.62); display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal.is-on { display: flex; }
    .modal-box { width: 100%; max-width: 320px; background: #241812; border-radius: 12px; padding: 20px 16px 12px; }
    .modal-title { font-size: 17px; font-weight: 700; text-align: center; }
    .modal-body { margin: 12px 0 16px; color: var(--c-text-2); font-size: 14px; line-height: 1.6; text-align: center; }
    .modal-acts { display: flex; gap: 8px; }
    .modal-acts .btn { flex: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="tab-bar" id="tabbar"></div>
  <div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
  <div class="loading" id="loading"><div class="loading-box" id="loadingText">请稍候</div></div>
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">提示</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-acts">
        <button class="btn btn-ghost" id="modalCancel">取消</button>
        <button class="btn btn-primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  function render() {
    var r = parseHash();
    var path = UPDATERS[r.path] ? r.path : '/home';
    if (path !== r.path) { location.replace('#/home'); return; }
    Object.keys(cache).forEach(function (p) { cache[p].el.classList.remove('is-on'); });
    var rec = ensure(path);
    if (!rec.built) BUILDERS[path](rec);
    rec.el.classList.add('is-on');
    UPDATERS[path](r.query);
    var ti = TAB_SET[path];
    tabbar.classList.toggle('is-on', ti !== undefined);
    [].forEach.call(tabbar.children, function (el, i) { el.classList.toggle('is-on', i === ti); });
    window.scrollTo(0, 0);
  }

  function doPay() {
    var ck = S.checkout;
    if (!ck) return;
    var pay = payable(ck.price);
    var c = find(S.coupons, S.couponId);
    if (c && pay < ck.price) c.status = 'used';
    if (ck.kind === 'group') {
      var s = find(CATALOG.sessions, ck.sessionId);
      if (!s || s.booked >= s.capacity) { toast('这节课已满员'); return; }
      s.booked += 1;
    }
    if (ck.kind === 'camp') {
      var camp = find(CATALOG.camps, ck.campId);
      if (camp) camp.booked += 1;
    }
    if (ck.kind === 'activity') {
      var act = find(CATALOG.activities, ck.activityId);
      if (act) act.booked += 1;
    }
    if (ck.kind === 'package') {
      var p = find(CATALOG.packages, ck.packageId);
      S.owned.push({ id: uid('OP'), packageId: p.id, name: p.name, total: p.sessions, remain: p.sessions, expire: ymd(addDays(p.validDays)) });
    }
    var oid = uid('O');
    var bid = uid('BK');
    var order = { id: oid, title: ck.title, payAmount: pay, status: 'paid', kind: ck.kind };
    S.orders.unshift(order);
    var booking = null;
    if (ck.kind !== 'package') {
      booking = { id: bid, orderId: oid, title: ck.title, when: ck.when, kind: ck.kind, status: 'upcoming', sessionId: ck.sessionId || '', cancelHours: ck.cancelHours || 6 };
      S.bookings.unshift(booking);
    }
    closeSheet();
    paySuccess(order, booking);
  }

  document.addEventListener('click', function (e) {

    if (!t) {
      if (!e.target.closest('.store-dd') && !e.target.closest('[data-act="toggle-dd"]')) {
        var dd = document.getElementById('storeDd');
        if (dd) dd.classList.remove('is-on');
      }
      return;
    }
    if (t.getAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    var act = t.getAttribute('data-act');
    var tab = t.getAttribute('data-tab');
    if (tab != null) { go(TABS[Number(tab)].path); return; }
    if (t.getAttribute('data-sch')) { S.schTab = t.getAttribute('data-sch'); updateSchedule(); return; }
    if (t.getAttribute('data-date')) { S.schDate = t.getAttribute('data-date'); updateSchedule(); return; }
    if (t.getAttribute('data-acttab')) { S.actTab = t.getAttribute('data-acttab'); updateActivities(); return; }
    if (t.getAttribute('data-btab')) { S.bookingTab = t.getAttribute('data-btab'); updateBookings(); return; }
    if (t.getAttribute('data-slotdate')) { S.slotDate = t.getAttribute('data-slotdate'); S.selectedSlot = ''; updateSlots(); return; }
    if (act === 'back') { back(); return; }
    if (act === 'close-sheet') { closeSheet(); return; }
    if (act === 'toggle-dd') {
      var box = document.getElementById('storeDd');
      var on = !box.classList.contains('is-on');
      box.classList.toggle('is-on', on);
      if (on) {
        box.innerHTML = '<div class="dd-cities">' + cities().map(function (c) {
          return '<div class="chip' + (c === S.user.city ? ' is-on' : '') + '" data-act="city" data-id="' + c + '">' + c + '</div>';
        }).join('') + '</div>' + storesIn(S.user.city).map(function (s) {

        }).join('');

    }
    if (act === 'pick-slot') { S.selectedSlot = t.getAttribute('data-id'); updateSlots(); return; }
    if (act === 'confirm-slot') {
      if (!S.selectedSlot) { toast('请选择时段'); return; }
      if (pkgRemain() <= 0) { toast('课包次数不足'); return; }
      S.owned[0].remain -= 1;
      S.busySlots[S.slotDate + '|' + S.selectedSlot] = true;
      var coach = coachById(S.currentCoach);
      var oid = uid('O');
      var bid = uid('BK');
      var when = md(S.slotDate) + ' ' + S.selectedSlot;
      S.orders.unshift({ id: oid, title: coach.name + ' 私教', payAmount: 0, status: 'paid', kind: 'private' });
      S.bookings.unshift({ id: bid, orderId: oid, title: coach.name + ' 私教', when: when, kind: 'private', status: 'upcoming' });
      S.lastResult = { ok: true, headline: '预约成功', title: coach.name + ' 私教', when: when };
      persist();
      toast('预约成功，已扣 1 次');
      go('/result', true);
      return;
    }
    if (act === 'pick-coupon') {
      var items = [{ id: '', name: '不使用优惠券' }].concat(unusedCoupons().map(function (c) { return { id: c.id, name: c.name + ' 满' + c.min + '减' + c.amount }; }));
      openSheet('<div class="sheet-h">选择优惠券</div>' + items.map(function (c) {
        return '<div class="list-row" data-act="use-coupon" data-id="' + c.id + '">' + c.name + '</div>';
      }).join(''));
      return;
    }
    if (act === 'use-coupon') { S.couponId = t.getAttribute('data-id'); closeSheet(); updateConfirm(); return; }
    if (act === 'go-pay') {
      var ck = S.checkout;
      var pay = payable(ck.price);
      openSheet('<div class="sheet-h">微信支付（演示）</div><div style="text-align:center;padding:8px 16px;"><div class="muted">应付</div><div class="price" style="font-size:28px;margin:8px 0;">' + yuan(pay) + '</div><div class="muted">不会产生真实扣款，仅演示占名额与到账。</div></div><div class="pad"><button class="btn btn-primary btn-lg" style="width:100%;" data-act="confirm-pay">确认支付</button><button class="btn btn-ghost btn-lg" style="width:100%;margin-top:8px;" data-act="close-sheet">取消</button></div>');
      return;
    }
    if (act === 'confirm-pay') {
      busy(true, '支付中');
      setTimeout(function () { busy(false); doPay(); }, 280);
      return;
    }
    if (act === 'notify') { S.user.notify = true; persist(); toast('已开启上课提醒'); return; }
    if (act === 'cancel-bk') {
      var b = find(S.bookings, t.getAttribute('data-id'));
      confirmDlg('取消预约', '确认取消这节课？已支付订单将标记为已退款。', '确认取消').then(function (ok) {
        if (!ok) return;
        busy(true, '取消中');
        setTimeout(function () {
          b.status = 'cancelled';
          if (b.sessionId) {
            var s = find(CATALOG.sessions, b.sessionId);
            if (s) s.booked = Math.max(0, s.booked - 1);
          }
          if (b.kind === 'private' && S.owned[0]) S.owned[0].remain += 1;
          var o = find(S.orders, b.orderId);
          if (o && o.status === 'paid' && o.payAmount > 0) o.status = 'refunded';
          persist();
          busy(false);
          toast(o && o.payAmount > 0 ? '已取消，退款将在几分钟内原路退回' : '已取消');
          updateBooking({ id: b.id });
        }, 300);
      });
      return;
    }
    if (act === 'ent-submit') {
      var company = (document.getElementById('entCompany') || {}).value || '';
      var name = (document.getElementById('entName') || {}).value || '';
      var phone = (document.getElementById('entPhone') || {}).value || '';
      var need = (document.getElementById('entNeed') || {}).value || '';
      if (!company || !name || !/^1\d{10}$/.test(phone) || !need) { toast('请填写完整信息'); return; }
      toast('我们会电话联系你');
      go('/profile');
      return;
    }
    if (act === 'legal') {
      var map = {
        user: ['用户协议', '使用燃练预约课程、课包和活动时，请遵守门店规则。演示页数据写死在本地，不产生真实交易。'],
        privacy: ['隐私政策', '演示页仅在浏览器本地保存登录与预约数据，不会上传到服务器。'],
        about: ['关于我们', '燃练是健身房团课 / 私教预约小程序的用户端演示。']
      };
      var L = map[t.getAttribute('data-id')];
      openSheet('<div class="sheet-h">' + L[0] + '</div><div class="pad" style="line-height:1.8;color:#e2b89a;">' + L[1] + '</div><div class="pad"><button class="btn btn-primary" style="width:100%;" data-act="close-sheet">我知道了</button></div>');
    }
  });
  mask.addEventListener('click', function (e) { if (e.target === mask) closeSheet(); });

  setInterval(function () {
    if (!cache['/home'] || !cache['/home'].el.classList.contains('is-on')) return;
    S.bannerIndex = (S.bannerIndex + 1) % CATALOG.banners.length;
    var track = document.getElementById('swiperTrack');
    var dots = document.getElementById('dots');
    if (track) track.style.transform = 'translateX(-' + (S.bannerIndex * 100) + '%)';
    if (dots) [].forEach.call(dots.children, function (d, i) { d.classList.toggle('is-on', i === S.bannerIndex); });
  }, 4000);

  window.addEventListener('hashchange', render);
  if (!location.hash) location.replace('#/home');
  else render();
})();
  </script>
</body>
</html>
